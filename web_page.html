<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

<div class="w-full max-w-6xl flex items-center justify-center px-6">

    <!-- Glass Card -->
    <div class="bg-white/80 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md transform hover:scale-105 transition duration-300">

        <h2 class="text-2xl font-bold text-center mb-4">🎉 Event Registration</h2>

        <form id="form" class="space-y-3">
            <input type="text" id="name" placeholder="Full Name" required
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">

            <input type="text" id="event" placeholder="Event Name"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">

            <!--  Premium Register Button -->
            <button class="w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white p-2 rounded-lg shadow-lg hover:scale-105 active:scale-95 hover:opacity-90 transition duration-300 cursor-pointer">
                Register
            </button>
        </form>

        <!-- Suggestion -->
        <p id="suggestion" class="text-sm mt-2 text-gray-600"></p>

        <!-- Notification -->
        <div id="notification" class="hidden mt-3 p-2 bg-green-100 text-green-700 rounded text-center font-medium"></div>

        <!-- QR Code -->
        <div id="qrcode" class="mt-4 flex justify-center"></div>

        <!--  Premium Download Button -->
        <button onclick="downloadPDF()" class="mt-3 w-full bg-gradient-to-r from-green-400 to-emerald-500 text-white p-2 rounded-lg shadow-lg hover:scale-105 active:scale-95 hover:brightness-110 transition duration-300 cursor-pointer">
            Download Pass
        </button>

        <!--  Premium Admin Button -->
        <button onclick="toggleAdmin()" class="mt-2 w-full bg-gradient-to-r from-gray-700 to-gray-900 text-white p-2 rounded-lg shadow-lg hover:scale-105 active:scale-95 hover:brightness-110 transition duration-300 cursor-pointer">
            Admin Panel
        </button>

        <!-- Dashboard -->
        <div id="admin" class="hidden mt-4 text-center">
            <h3 class="font-bold">📊 Dashboard</h3>
            <p id="total"></p>
            <p id="popular"></p>
        </div>

    </div>

</div>

<script>
const form = document.getElementById("form");
let currentData = {};

// Smart Suggestion (Event-based)
document.getElementById("event").addEventListener("input", function() {
    const eventInput = this.value.toLowerCase();
    let suggestion = "";

    if (eventInput.includes("tech") || eventInput.includes("code") || eventInput.includes("hack")) {
        suggestion = "Suggested: Tech Fest 💻";
    } 
    else if (eventInput.includes("dance") || eventInput.includes("music") || eventInput.includes("cultural")) {
        suggestion = "Suggested: Cultural Event 🎭";
    } 
    else if (eventInput.includes("work") || eventInput.includes("learn")) {
        suggestion = "Suggested: Workshop 📚";
    } 
    else {
        suggestion = "";
    }

    document.getElementById("suggestion").innerText = suggestion;
});

// Generate ID
function generateID() {
    return "EVT" + Math.floor(1000 + Math.random() * 9000);
}

// Submit
form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;

// Event Categorization
    let eventInput = document.getElementById("event").value.toLowerCase();
    let event;

if (eventInput.includes("tech") || eventInput.includes("code")) {
    event = "Tech Fest";
} 
else if (eventInput.includes("dance") || eventInput.includes("music")) {
    event = "Cultural Event";
} 
else if (eventInput.trim() === "") {
    event = "Workshop"; // default
} 
else {
    event = document.getElementById("event").value;
}

    const id = generateID();
    currentData = { id, name, event };

    const data = JSON.parse(localStorage.getItem("registrations")) || [];
    data.push(currentData);
    localStorage.setItem("registrations", JSON.stringify(data));

    // Notification
    const notification = document.getElementById("notification");
    notification.innerHTML = `🎉 Registration Successful!<br>Your ID: <b>${id}</b>`;
    notification.classList.remove("hidden");

    setTimeout(() => notification.classList.add("hidden"), 3000);

    // QR Code
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: `ID: ${currentData.id}\nName: ${currentData.name}\nEvent: ${currentData.event}`,
        width: 150,
        height: 150
    });

    updateDashboard();
    form.reset();
    document.getElementById("suggestion").innerText = "";
});

// Dashboard
function updateDashboard() {
    const data = JSON.parse(localStorage.getItem("registrations")) || [];
    let eventCount = {};

    data.forEach(item => {
        eventCount[item.event] = (eventCount[item.event] || 0) + 1;
    });

    document.getElementById("total").innerText = "Total Registrations: " + data.length;

    let popular = Object.keys(eventCount).reduce((a, b) =>
        eventCount[a] > eventCount[b] ? a : b, "None");

    document.getElementById("popular").innerText = "Most Popular: " + popular;
}

// Admin Toggle
function toggleAdmin() {
    document.getElementById("admin").classList.toggle("hidden");
}

// PDF
async function downloadPDF() {
    if (!currentData.id) {
        alert("Register first!");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("Event Registration Pass", 20, 20);
    doc.text(`ID: ${currentData.id}`, 20, 40);
    doc.text(`Name: ${currentData.name}`, 20, 50);
    doc.text(`Event: ${currentData.event}`, 20, 60);

    doc.save("pass.pdf");
}
</script>

</body>
</html>
