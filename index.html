<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* Tablet view */
        @media (max-width: 768px) {
            .w-full {
                width: 100%;
            }
            .max-w-md {
                max-width: 90%;
            }
        }

        /* Mobile view */
        @media (max-width: 480px) {
            .w-full {
                width: 100%;
            }
            .max-w-md {
                max-width: 95%;
            }
        }
    </style>

</head>

<body class="bg-gradient-to-br from-[#43cea2] via-[#185a9d] to-[#667eea] min-h-screen flex items-center justify-center">
<div class="w-full max-w-6xl flex items-center justify-center px-6">

    <div class="bg-white/80 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md transform hover:scale-105 transition duration-300">

        <h2 class="text-2xl font-bold text-center mb-4"> Event Registration </h2>

        <form id="form" class="space-y-3">
            <input type="text" id="name" placeholder="Full Name" required
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">

            <input type="text" id="event" placeholder="Event Name"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">

            <button class="mt-3 w-full bg-gradient-to-r from-green-400 to-emerald-500 text-white p-2 rounded-lg shadow-lg hover:scale-105 active:scale-95 hover:brightness-110 transition duration-300 cursor-pointer">
                Register
            </button>
        </form>

        <!-- Suggestion -->
        <p id="suggestion" class="text-sm mt-2 text-gray-600"></p>

        <!-- Notification -->
        <div id="notification" class="hidden mt-3 p-2 bg-green-100 text-green-700 rounded text-center font-medium"></div>

        <!-- QR Code -->
        <div id="qrcode" class="mt-4 flex justify-center"></div>

       <button onclick="downloadPDF()" class="w-full bg-gradient-to-r from-[#0369a1] via-[#0ea5e9] to-[#e0f2fe] text-white p-2 rounded-lg shadow-md hover:scale-105 transition duration-300 soft-glow">
         Download Pass 
       </button>

        <button onclick="window.open('admin.html','_blank')" class="mt-2 w-full bg-gradient-to-r from-gray-700 to-gray-900 text-white p-2 rounded-lg shadow-lg hover:scale-105 active:scale-95 hover:brightness-110 transition duration-300 cursor-pointer">
            Admin Panel
        </button>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const form = document.getElementById("form");
    let currentData = {};

    // Smart Suggestion (Event-based)
    document.getElementById("event").addEventListener("input", function() {
        const eventInput = this.value.toLowerCase();
        let suggestion = "";

        if (eventInput.includes("tech") || eventInput.includes("code") || eventInput.includes("hack")) {
            suggestion = "Suggested: Tech Fest ";
        } 
        else if (eventInput.includes("dance") || eventInput.includes("music") || eventInput.includes("cultural")) {
            suggestion = "Suggested: Cultural Event ";
        } 
        else if (eventInput.includes("work") || eventInput.includes("learn")) {
            suggestion = "Suggested: Workshop ";
        } 
        else {
            suggestion = "";
        }

        document.getElementById("suggestion").innerText = suggestion;
    });

    // Generate ID
    function generateID() {
        return "EVT" + Math.floor(1000 + Math.random() * 9000);
    }

    // QR Code generator
    function generateQR(data) {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // clear previous QR

        new QRCode(qrContainer, {
            text: data,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    // Submit
    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        let eventInput = document.getElementById("event").value.toLowerCase();
        let event;

        if (eventInput.includes("tech") || eventInput.includes("code")) {
            event = "Tech Fest";
        } 
        else if (eventInput.includes("dance") || eventInput.includes("music")) {
            event = "Cultural Event";
        } 
        else if (eventInput.trim() === "") {
            event = "Workshop"; 
        } 
        else {
            event = document.getElementById("event").value;
        }

        const id = generateID();
        currentData = { id, name, event };

        // LOCAL STORAGE
        const dataArr = JSON.parse(localStorage.getItem("registrations")) || [];
        dataArr.push(currentData);
        localStorage.setItem("registrations", JSON.stringify(dataArr));

        // PHP DATABASE SAVE
        const formData = new FormData();
        formData.append("id", id);
        formData.append("name", name);
        formData.append("event", event);

        fetch("save.php", { method: "POST", body: formData })
        .then(res => res.text())
        .then(data => {
            console.log("Server response:", data);
            if (data.trim() === "Saved Successfully") {
                // Notification
                const notification = document.getElementById("notification");
                notification.innerHTML = `Registration Successful!<br>Your ID: <b>${id}</b>`;
                notification.classList.remove("hidden");
                setTimeout(() => notification.classList.add("hidden"), 3000);

                // QR Code links to your site
                const qrData = `https://kashishrai.infinityfreeapp.com/?id=${id}&name=${encodeURIComponent(name)}&event=${encodeURIComponent(event)}`;
                generateQR(qrData);

                // Update Dashboard
                updateDashboard();

                form.reset();
                document.getElementById("suggestion").innerText = "";
            } else {
                alert("Server Error: " + data);
            }
        })
        .catch(err => {
            console.log("Fetch Error:", err);
            alert("Cannot connect to server. Make sure save.php exists.");
        });
    });

    // Dashboard
    function updateDashboard() {
        fetch("dashboard.php")
        .then(res => res.json())
        .then(data => {
            if(document.getElementById("total")) {
                document.getElementById("total").innerText = "Total Registrations: " + data.total;
                document.getElementById("popular").innerText = "Most Popular: " + data.popular;
            }
        });
    }

    // PDF Download
    window.downloadPDF = async function() {
        if (!currentData.id) {
            alert("Register first!");
            return;
        }

        const jsPDF = window.jspdf.jsPDF;
        const doc = new jsPDF();

        // Background Gradient
        for (let i = 0; i < 210; i++) {
            let r = 255;
            let g = 190 + i * 0.1;
            let b = 170 + i * 0.2;
            doc.setFillColor(r, g, b);
            doc.rect(0, i, 210, 1, 'F');
        }

        const cardX = 15;
        const cardY = 45;
        const cardW = 180;
        const cardH = 100;

        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cardX, cardY, cardW, cardH, 12, 12, 'F');

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(60, 60, 60);
        doc.text("Event Pass", 105, 65, { align: "center" });

        const qrSize = 45;
        const qrX = cardX + cardW - qrSize - 15;
        const qrY = cardY + (cardH - qrSize) / 2;

        const qrCanvas = document.querySelector("#qrcode canvas");

        if (qrCanvas) {
            const qrImage = qrCanvas.toDataURL("image/png");
            doc.addImage(qrImage, "PNG", qrX, qrY, qrSize, qrSize);

            doc.setDrawColor(200);
            doc.rect(qrX, qrY, qrSize, qrSize);
        } else {
            alert("QR not generated yet!");
        }

        const centerY = qrY + qrSize / 2;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.setTextColor(70, 70, 70);

        const textStartY = centerY - 15;

        doc.text(`ID: ${currentData.id}`, 30, textStartY);
        doc.text(`Name: ${currentData.name}`, 30, textStartY + 15);
        doc.text(`Event: ${currentData.event}`, 30, textStartY + 30);

        doc.setDrawColor(220);
        doc.setLineWidth(0.5);

        const lineX = 120;
        doc.line(lineX, qrY, lineX, qrY + qrSize);

        doc.setFontSize(10);
        doc.setTextColor(120, 120, 120);
        doc.text("Show this pass at entry gate", 105, 135, { align: "center" });
        
        doc.save("Event_Pass.pdf");
    }

    // View Database
    window.openDatabase = function() {
        window.open("view.php", "_blank");
    }

});
</script>
</body>
</html>
